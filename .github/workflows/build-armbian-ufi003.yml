# =============================================================================
# UFI003 OpenStick (no-modem) — Armbian 构建 Workflow
# GitHub Actions ubuntu-24.04 runner
# =============================================================================
# ROUND 3 修复 (在 Round 2 基础上修 3 处致命问题):
#
#   A. defconfig 名称错误 + pipefail 缺失:
#      Round 2 两处写 `make msm8916_defconfig | tail -5` —
#      主线 Linux arm64/configs/ 只有 defconfig, hardening.config, virt.config
#      三个文件! 根本没有 msm8916_defconfig!
#      这条 make 必然失败, 但 | tail -5 吞了错误 (没开 pipefail),
#      导致 .config 是空的, olddefconfig 补成几乎全默认值的配置,
#      结果就是 "编译成功但开不了机".
#      修复: 抽成 scripts/gen-kernel-config.sh, 用 make defconfig,
#      set -euo pipefail, 所有步骤失败立即终止.
#
#   B. 加硬校验:
#      make defconfig 后立即校验 CONFIG_ARCH_QCOM=y,
#      olddefconfig 后校验 CONFIG_ARCH_QCOM + CONFIG_EXT4_FS + CONFIG_BLK_DEV_INITRD
#      + CONFIG_ 总数 > 3000, 打印 fragment 里的关键项实际值.
#      任何一项不满足直接 exit 1.
#
#   C. 双份生成逻辑抽成单一脚本:
#      prepare 和 build 两个 job 都调用 scripts/gen-kernel-config.sh,
#      避免两处独立实现以后改一处漏一处.
#
# 关键源码参考 (armbian/build @ 815a50b6, 2026-07-11):
#   prepare_kernel_config_core_or_userpatches:
#     优先级 1: userpatches/linux-$FAMILY-$BRANCH.config
#     优先级 2: userpatches/config/kernel/linux-$FAMILY-$BRANCH.config  ← 我们放这里
#     优先级 3: armbian/config/kernel/linux-$FAMILY-$BRANCH.config
#   kernel-config.sh L8-21
#
# arm64 主线 defconfig 参考:
#   https://github.com/torvalds/linux/tree/v6.12/arch/arm64/configs
#   (只有 defconfig, hardening.config, virt.config — 没有 SoC-specific 的)
# =============================================================================

name: Build UFI003 OpenStick Armbian (no-modem)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "内核分支 (current=6.12, edge=7.2)"
        required: false
        default: "current"
        type: choice
        options:
          - current
          - edge
      release:
        description: "发行版"
        required: false
        default: "bookworm"
        type: choice
        options:
          - bookworm
          - noble
      build_minimal:
        description: "最小化 rootfs (更快)"
        required: false
        default: "yes"
        type: choice
        options:
          - yes
          - no

  push:
    branches: [main]

  pull_request:
    branches: [main]

concurrency:
  group: ufi003-build-${{ github.ref }}
  cancel-in-progress: false

env:
  BOARD: ufi003
  KERNEL_CONFIGURE: no
  EXPERT: no
  # Round 5: 关掉 xz 压缩 — armbian 的 compress-checksum.sh 用子串匹配 (*xz* / *zst* / *sha*),
  # 空值 = 不压缩不校验, 直接留下 .img 原文件, 省掉一份全尺寸临时文件 + xz 工作内存.
  # assemble job 已支持 .img / .img.xz 两种输入 (L466 find 两种后缀).
  COMPRESS_OUTPUTIMAGE: ""
  MAKEFLAGS: "-j2"
  DEBIAN_FRONTEND: noninteractive
  ARMBIAN_BUILD_DIR: ${{ github.workspace }}/armbian-build
  KERNEL_CONFIG_DIR: ${{ github.workspace }}/kernel-configs

jobs:

# ============================================================
# Job 1: prepare — deps + armbian clone + 生成完整 kernel .config
# 作用:
#   - 验证 kernel clone + defconfig + fragment merge 可行
#   - 生成完整 .config 并上传 artifact 供 debug
# ============================================================
  prepare:
    name: "prepare: deps + config + kernel .config"
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps (build + cross-compile + kernel)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
              bison flex patch bc jq wget curl rsync xz-utils p7zip-full pigz \
              device-tree-compiler uuid-dev libssl-dev libncurses-dev libxml2-dev libxml2-utils \
              liblz4-tool lzop ccache swig time libelf-dev dwarves \
              python3-dev python3-pyelftools python3-setuptools \
              gcc-aarch64-linux-gnu gcc-arm-none-eabi libnewlib-arm-none-eabi \
              qemu-user-static qemu-user binfmt-support git gnupg2 u-boot-tools fdisk gdisk \
              dwarves pahole git-lfs
          sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true

      - name: Clone armbian/build
        run: |
          git clone --depth 1 --branch main https://github.com/armbian/build.git "${ARMBIAN_BUILD_DIR}"
          echo "Clone OK: $(du -sh "${ARMBIAN_BUILD_DIR}" | cut -f1)"

      - name: Install our board configs into armbian/build
        run: |
          mkdir -p \
              "${ARMBIAN_BUILD_DIR}/config/boards" \
              "${ARMBIAN_BUILD_DIR}/config/sources/families" \
              "${ARMBIAN_BUILD_DIR}/config/bootscripts" \
              "${ARMBIAN_BUILD_DIR}/config/sections" \
              "${ARMBIAN_BUILD_DIR}/userpatches/kernel" \
              "${ARMBIAN_BUILD_DIR}/userpatches/kernel/archive/msm8916-6.12"

          cp config/boards/ufi003.csc                 "${ARMBIAN_BUILD_DIR}/config/boards/"
          cp config/sources/families/msm8916.conf     "${ARMBIAN_BUILD_DIR}/config/sources/families/"
          cp config/bootscripts/bootscript-msm8916.sh  "${ARMBIAN_BUILD_DIR}/config/bootscripts/"
          cp config/sections/msm8916.config           "${ARMBIAN_BUILD_DIR}/config/sections/"
          cp scripts/gen-kernel-config.sh             "${ARMBIAN_BUILD_DIR}/scripts/" 2>/dev/null || true
          # patch 放根目录 (无害, 不会被扫) + 真正生效的位置
          cp userpatches/kernel/add-openstick-dts-ufi003-nomodem.patch \
             "${ARMBIAN_BUILD_DIR}/userpatches/kernel/"
          # 关键: armbian 只扫 userpatches/kernel/<KERNELPATCHDIR>/,
          # KERNELPATCHDIR=archive/msm8916-6.12 (日志: "KERNELPATCHDIR is unset; using 'archive/msm8916-6.12'")
          cp userpatches/kernel/add-openstick-dts-ufi003-nomodem.patch \
             "${ARMBIAN_BUILD_DIR}/userpatches/kernel/archive/msm8916-6.12/"
          echo "=== kernel patches in archive/msm8916-6.12 ==="
          ls -la "${ARMBIAN_BUILD_DIR}/userpatches/kernel/archive/msm8916-6.12/"
          cp msm8916-handsome-openstick-ufi003-armbian.dts \
             "${ARMBIAN_BUILD_DIR}/userpatches/" 2>/dev/null || true

      # ---- Round 3: 调统一脚本生成 .config ----
      # 这里和 build job 的对应 step 调同一个脚本, 行为完全一致.
      # 脚本内部 set -euo pipefail, 任何 defconfig/olddefconfig/校验失败立即 exit 1.
      - name: Generate full kernel .config (via scripts/gen-kernel-config.sh)
        run: |
          BRANCH="${{ inputs.branch || 'current' }}"

          bash scripts/gen-kernel-config.sh \
              --branch "$BRANCH" \
              --fragment "config/sections/msm8916.config" \
              --output-dir "${ARMBIAN_BUILD_DIR}/userpatches" \
              --output-dir "${ARMBIAN_BUILD_DIR}/userpatches/config/kernel"

      - name: Quick sanity check — Armbian can see our board + kernel config
        run: |
          cd "${ARMBIAN_BUILD_DIR}"
          echo "=== Board KERNEL_TARGET check ==="
          grep -q 'KERNEL_TARGET="current,edge"' config/boards/ufi003.csc && echo "OK: KERNEL_TARGET allows current" || { echo "FAIL: KERNEL_TARGET"; exit 1; }
          echo ""
          echo "=== Kernel config file present in userpatches ==="
          ls -la userpatches/config/kernel/
          echo ""
          echo "=== Done prepare ==="

# ============================================================
# Job 2: compile.sh — 正式构建
# ============================================================
  build-armbian:
    name: "build: armbian compile.sh"
    # ------------------------------------------------------------
    # 兜底方案: 如果 14GB 标准 runner 的磁盘怎么腾都不够, 换 larger runner.
    # GitHub "larger runners" 是付费的 (按分钟计费), 4-core 规格磁盘远大于 14GB.
    # 启用方式: 注释掉下面这行 runs-on, 换成下一行 (需仓库已有 larger runner 权限)
    # ------------------------------------------------------------
    runs-on: ubuntu-24.04
    # runs-on: ubuntu-latest-4-cores
    timeout-minutes: 360
    needs: [prepare]
    if: github.event_name != 'pull_request'

    outputs:
      exit_code: ${{ steps.compile.outputs.exit_code }}
      elapsed_minutes: ${{ steps.compile.outputs.elapsed_minutes }}

    env:
      CCACHE_DIR: ${{ github.workspace }}/ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Free up disk space  (Round 4)
      #
      # 依据: armbian/build lib/functions/host/prepare-host.sh
      #   L340-349 check_host_has_enough_disk_space(): 检查 DEST 和 SRC/cache
      #   L347   check_dir_has_enough_disk_space "${dir}" 10 || exit_if_countdown_not_aborted 10 ...
      #   L353   declare -i min_free_space_gib="${2:-10}"
      #   → 10GiB 是硬编码常量, 源码里没有任何 ARMBIAN_MIN_DISK_SPACE 之类的 override 变量.
      #   非交互模式下直接 exit 43.
      # 所以只能真腾磁盘, 不能 hack 阈值.
      #
      # ubuntu-24.04 runner 预装大量用不上的大件, 常见可回收:
      #   /usr/share/dotnet (~2-4GB), /usr/local/lib/android (~8-12GB),
      #   /opt/ghc (~1-2GB), /opt/hostedtoolcache/CodeQL (~3-5GB),
      #   docker 残留镜像 (~2-4GB), apt 缓存 (~0.5-1GB)
      #
      # 注意:
      #   - 所有清理命令都带 || true, 清理失败绝不把 job 搞挂
      #   - 绝不碰 ${GITHUB_WORKSPACE}(/home/runner/work) 和 armbian-build 目录
      #   - 放到 Install deps 之前: 先腾地方, 再装依赖/拉镜像, 空间最宽松
      # ============================================================
      - name: Free up disk space
        run: |
          echo "=== Disk BEFORE cleanup ==="
          df -h / 2>/dev/null || true
          echo ""

          # GitHub 预装的无用组件
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/microsoft || true
          sudo rm -rf /usr/local/.ghcup || true

          # apt 缓存 + 索引缓存 (后面 Install deps 会重新 apt-get update)
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo rm -rf /var/cache/apt/archives/*.deb || true

          # 上一次构建残留的 docker 镜像 (compile.sh 在 docker 容器里跑)
          # -a 会清掉所有未被容器使用的镜像, 包括 armbian.local.only/armbian-build
          sudo docker image prune -a -f || true
          sudo docker builder prune -a -f || true

          echo ""
          echo "=== Disk AFTER cleanup ==="
          df -h / 2>/dev/null || true
          echo ""
          echo "=== Disk of workspace (compile.sh 的 output 就在这个盘上) ==="
          df -h "${GITHUB_WORKSPACE}" 2>/dev/null || true
          echo ""
          echo "=== 提醒: armbian 要求 output 所在磁盘 >= 10GiB 空闲 (硬编码, 不可覆盖) ==="

          # 打印一个明确的数字, 方便直接看这次腾出了多少 / 还差多少
          FREE_GIB=$(df -BG --output=avail / 2>/dev/null | tail -1 | tr -dc '0-9' || echo 0)
          FREE_GIB="${FREE_GIB:-0}"
          echo "=== Free space on / after cleanup: ${FREE_GIB} GiB (armbian 阈值: 10 GiB) ==="
          if [[ "${FREE_GIB}" -lt 12 ]]; then
            echo "::warning ::Only ${FREE_GIB}GiB free on / — 距 armbian 10GiB 阈值余量很小, 内核+rootfs 编译中途有 ENOSPC 风险"
          fi

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
              bison flex patch bc jq wget curl rsync xz-utils p7zip-full pigz \
              device-tree-compiler uuid-dev libssl-dev libncurses-dev libxml2-dev libxml2-utils \
              liblz4-tool lzop ccache swig time qemu-user-static qemu-user binfmt-support \
              python3-dev python3-pyelftools python3-setuptools \
              gcc-aarch64-linux-gnu gcc-arm-none-eabi libnewlib-arm-none-eabi \
              git gnupg2 u-boot-tools fdisk gdisk kpartx dwarves pahole

      # ============================================================
      # Round 5: ccache 关闭
      # ccache 省的是时间, 占的是磁盘 (cache 目录 + actions/cache 压缩包两份).
      # 14GB runner 上磁盘是瓶颈, 且首次全量编译命中率本来就低 -> 先关掉.
      # 恢复办法: 去掉下面注释即可.
      # - name: Restore ccache
      #   uses: actions/cache/restore@v4
      #   with:
      #     path: ${{ env.CCACHE_DIR }}
      #     key: ccache-${{ runner.os }}-${{ hashFiles('**/kernel/*.patch', 'config/sections/*.config') }}
      #     restore-keys: |
      #       ccache-${{ runner.os }}-

      # ============================================================
      # Round 5: 若 /mnt 是独立且更大的盘, 把 armbian-build 整个搬过去
      #
      # 为什么用 symlink 而不是 bind mount:
      #   armbian 自己在 docker 里跑, 容器只 bind mount 了 SRC 等少数路径.
      #   docker 创建 bind mount 时会解析 host 侧 symlink 到真实路径,
      #   容器内的挂载点仍是 /armbian, 与之前完全一致, 不需要改任何容器参数.
      #   而 bind mount 方案要在 host 上额外 mount, 容器里的路径映射还得手动对齐,
      #   反而更容易出错. 所以选 symlink.
      #
      # 如果 /mnt 与 / 是同一设备 (现代镜像有时会这样), 直接跳过并打印 "same disk".
      # ============================================================
      - name: Relocate heavy dirs to /mnt (only if separate and larger)
        run: |
          set -u
          ROOT_DEV=$(df -P / | awk 'NR==2{print $1}')
          ROOT_GIB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9'); ROOT_GIB=${ROOT_GIB:-0}
          echo "[/]    device=${ROOT_DEV} free=${ROOT_GIB}GiB"

          if [ ! -d /mnt ]; then
            echo "[mnt] /mnt missing -> skip relocation"
            exit 0
          fi

          MNT_DEV=$(df -P /mnt | awk 'NR==2{print $1}')
          MNT_GIB=$(df -BG --output=avail /mnt | tail -1 | tr -dc '0-9'); MNT_GIB=${MNT_GIB:-0}
          echo "[/mnt] device=${MNT_DEV} free=${MNT_GIB}GiB"

          if [ "$MNT_DEV" = "$ROOT_DEV" ]; then
            echo "[mnt] same disk as / (${ROOT_DEV}) -> skip relocation"
            exit 0
          fi
          if [ "$MNT_GIB" -le "$ROOT_GIB" ]; then
            echo "[mnt] not larger than / -> skip relocation"
            exit 0
          fi

          sudo mkdir -p /mnt/ufi003
          sudo chown -R "$(id -u):$(id -g)" /mnt/ufi003
          rm -rf "${ARMBIAN_BUILD_DIR}"
          mkdir -p /mnt/ufi003/armbian-build
          ln -s /mnt/ufi003/armbian-build "${ARMBIAN_BUILD_DIR}"
          echo "[mnt] relocated: ${ARMBIAN_BUILD_DIR} -> $(readlink -f "${ARMBIAN_BUILD_DIR}")"
          df -h /mnt || true

      - name: Clone armbian/build + install configs
        run: |
          git clone --depth 1 --branch main https://github.com/armbian/build.git "${ARMBIAN_BUILD_DIR}"

          mkdir -p \
              "${ARMBIAN_BUILD_DIR}/config/boards" \
              "${ARMBIAN_BUILD_DIR}/config/sources/families" \
              "${ARMBIAN_BUILD_DIR}/config/bootscripts" \
              "${ARMBIAN_BUILD_DIR}/config/sections" \
              "${ARMBIAN_BUILD_DIR}/userpatches/kernel" \
              "${ARMBIAN_BUILD_DIR}/userpatches/kernel/archive/msm8916-6.12" \
              "${ARMBIAN_BUILD_DIR}/userpatches/config/kernel"

          cp config/boards/ufi003.csc                 "${ARMBIAN_BUILD_DIR}/config/boards/"
          cp config/sources/families/msm8916.conf     "${ARMBIAN_BUILD_DIR}/config/sources/families/"
          cp config/bootscripts/bootscript-msm8916.sh  "${ARMBIAN_BUILD_DIR}/config/bootscripts/"
          cp config/sections/msm8916.config           "${ARMBIAN_BUILD_DIR}/config/sections/"
          # patch 放根目录 (无害, 不会被扫) + 真正生效的位置
          cp userpatches/kernel/add-openstick-dts-ufi003-nomodem.patch \
             "${ARMBIAN_BUILD_DIR}/userpatches/kernel/"
          # 关键: armbian 只扫 userpatches/kernel/<KERNELPATCHDIR>/,
          # KERNELPATCHDIR=archive/msm8916-6.12 (日志: "KERNELPATCHDIR is unset; using 'archive/msm8916-6.12'")
          cp userpatches/kernel/add-openstick-dts-ufi003-nomodem.patch \
             "${ARMBIAN_BUILD_DIR}/userpatches/kernel/archive/msm8916-6.12/"
          echo "=== kernel patches in archive/msm8916-6.12 ==="
          ls -la "${ARMBIAN_BUILD_DIR}/userpatches/kernel/archive/msm8916-6.12/"
          cp msm8916-handsome-openstick-ufi003-armbian.dts \
             "${ARMBIAN_BUILD_DIR}/userpatches/" 2>/dev/null || true

          git config --global --add safe.directory /github/workspace/armbian-build 2>/dev/null || true

      # ============================================================
      # Round 3: build job 也调同一个脚本生成 .config
      # 不依赖 prepare artifact — build job 自己生成, 更健壮.
      # 脚本内部 set -euo pipefail, 任何失败立即 exit 1.
      # ============================================================
      - name: Generate full kernel .config (via scripts/gen-kernel-config.sh)
        run: |
          BRANCH="${{ inputs.branch || 'current' }}"

          bash scripts/gen-kernel-config.sh \
              --branch "$BRANCH" \
              --fragment "config/sections/msm8916.config" \
              --output-dir "${ARMBIAN_BUILD_DIR}/userpatches" \
              --output-dir "${ARMBIAN_BUILD_DIR}/userpatches/config/kernel"

          echo ""
          echo "=== Verify installed .config ==="
          CONFIG_NAME="linux-msm8916-${BRANCH}.config"
          ls -la "${ARMBIAN_BUILD_DIR}/userpatches/${CONFIG_NAME}"
          ls -la "${ARMBIAN_BUILD_DIR}/userpatches/config/kernel/${CONFIG_NAME}"

      # ============================================================
      # Round 5: 磁盘守门 — 编译前必须有 >= 12GiB 可用
      # armbian 自己的门槛是 10GiB (prepare-host.sh:347 硬编码), 但 10GiB 只够它启动,
      # 内核+rootfs+debootstrap 峰值约 8-11GiB, 所以这里留 2GiB 余量.
      # 宁可 30 秒失败, 也不要等 60 分钟后死在 apt 里.
      # ============================================================
      - name: Disk gate before compile (>=12GiB) + snapshot
        run: |
          REPORT="${GITHUB_WORKSPACE}/disk-report.txt"
          FREE_GIB=$(df -BG --output=avail "${ARMBIAN_BUILD_DIR}" 2>/dev/null | tail -1 | tr -dc '0-9')
          FREE_GIB=${FREE_GIB:-0}

          {
            echo "=============================================="
            echo "=== BEFORE compile  $(date -u +%FT%TZ) ==="
            echo "=============================================="
            df -h / || true
            df -h "${ARMBIAN_BUILD_DIR}" || true
            [ -d /mnt ] && df -h /mnt || true
            echo "--- du key dirs (before) ---"
            du -sh "${ARMBIAN_BUILD_DIR}/" 2>/dev/null || true
            du -sh "${ARMBIAN_BUILD_DIR}/cache/sources" 2>/dev/null || true
            du -sh "${ARMBIAN_BUILD_DIR}/cache" 2>/dev/null || true
            du -sh "${ARMBIAN_BUILD_DIR}/output" 2>/dev/null || true
            du -sh "${ARMBIAN_BUILD_DIR}/userpatches" 2>/dev/null || true
            du -sh /var/lib/docker 2>/dev/null || true
            echo "free=${FREE_GIB}GiB"
          } | tee -a "$REPORT"

          echo ""
          echo "=== Disk gate: ${FREE_GIB}GiB free, need >= 12GiB ==="
          if [ "${FREE_GIB}" -lt 12 ]; then
            echo "::error ::runner disk too small for this build: only ${FREE_GIB}GiB free, need >=12GiB. Use a larger runner (see commented runs-on example) or a self-hosted runner."
            exit 1
          fi

      # ============================================================
      # compile.sh — 不套 sudo, 直接跑 (runner 默认 root)
      # pipefail 保证 tee 不吞退出码
      # ============================================================
      - name: Run compile.sh (no sudo, pipefail, hard img check)
        id: compile
        run: |
          cd "${ARMBIAN_BUILD_DIR}"

          BRANCH="${{ inputs.branch || 'current' }}"
          RELEASE="${{ inputs.release || 'bookworm' }}"
          BUILD_MINIMAL="${{ inputs.build_minimal || 'yes' }}"

          echo "=== Parameters ==="
          echo "  BOARD=${BOARD} BRANCH=${BRANCH} RELEASE=${RELEASE} MINIMAL=${BUILD_MINIMAL}"
          echo "  MAKEFLAGS=${MAKEFLAGS}"
          echo "  ARMBIAN_BUILD_DIR=${ARMBIAN_BUILD_DIR}"
          echo "  USER=$(whoami) UID=$(id -u)"
          echo ""

          # pipefail: tee 不吞 exit code
          set -o pipefail

          START_TS=$(date +%s)
          {
            # 不套 sudo: GitHub runner 的默认用户是 runner (非 root), 有 passwordless sudo.
            # compile.sh 检测到 EUID != 0 且 Docker 可用时, 会自己 relaunch 到 Docker 容器
            # (utils-cli.sh L302-329: cli_standard_relaunch_docker_or_sudo, PREFER_DOCKER 默认 yes).
            # 日志里的 "Docker run failed" 前缀 [🐳|...] 就是这个机制.
            # 如果套 sudo 会走进 EUID==0 分支, 触发 "don't run ./compile.sh as root" 的告警路径.
            ./compile.sh \
                BOARD="${BOARD}" \
                BRANCH="${BRANCH}" \
                RELEASE="${RELEASE}" \
                BUILD_MINIMAL="${BUILD_MINIMAL}" \
                KERNEL_CONFIGURE=no \
                EXPERT=no \
                COMPRESS_OUTPUTIMAGE="${COMPRESS_OUTPUTIMAGE}" \
                VERBOSE="no"
          } 2>&1 | tee "${ARMBIAN_BUILD_DIR}/compile.log"
          RC=${PIPESTATUS[0]}
          ELAPSED=$(( ($(date +%s) - START_TS) / 60 ))
          set +o pipefail

          echo ""
          echo "compile.sh exit=${RC}, elapsed=${ELAPSED}min"
          echo ""

          # ---- 硬校验 1: compile.sh 返回码必须 0 ----
          if [[ $RC -ne 0 ]]; then
              echo "=== compile.sh FAILED with exit code ${RC} ==="
              echo ""
              echo "=== Last 150 lines of compile.log ==="
              tail -150 "${ARMBIAN_BUILD_DIR}/compile.log" || true
              echo ""
              exit 1
          fi

          # ---- 硬校验 2: 必须有 rootfs img ----
          echo "=== HARD CHECK: find rootfs img ==="
          echo "output directory contents:"
          find "${ARMBIAN_BUILD_DIR}/output" -maxdepth 3 -type f 2>/dev/null | head -50

          IMG_COUNT=$(find "${ARMBIAN_BUILD_DIR}/output" -type f \( -name "*.img" -o -name "*.img.xz" \) 2>/dev/null | wc -l)
          echo ""
          echo "img files found: ${IMG_COUNT}"
          find "${ARMBIAN_BUILD_DIR}/output" -type f \( -name "*.img" -o -name "*.img.xz" \) 2>/dev/null
          echo ""

          if [[ $IMG_COUNT -eq 0 ]]; then
              echo "FATAL: No .img files found in output directory!"
              echo "Assemble job requires a rootfs image. compile.sh may have succeeded but produced nothing."
              echo "Last 80 lines of compile.log:"
              tail -80 "${ARMBIAN_BUILD_DIR}/compile.log" || true
              echo ""
              exit 1
          fi

          echo ""
          echo "exit_code=0"              >> "$GITHUB_OUTPUT"
          echo "elapsed_minutes=${ELAPSED}" >> "$GITHUB_OUTPUT"
          echo "compile.sh OK, ${IMG_COUNT} img files produced"

      # Round 5: ccache save 关闭 (理由同上方 Restore ccache)
      # - name: Save ccache
      #   if: always()
      #   uses: actions/cache/save@v4
      #   with:
      #     path: ${{ env.CCACHE_DIR }}
      #     key: ccache-${{ runner.os }}-${{ hashFiles('**/kernel/*.patch', 'config/sections/*.config') }}

      # ============================================================
      # Round 5: 编译后磁盘观测 (always) — 失败也执行
      # 输出写进 disk-report.txt, 下一次用 always() 上传, 保证失败也能拿到
      # ============================================================
      - name: Collect disk diagnostics after compile (always)
        if: always()
        run: |
          REPORT="${GITHUB_WORKSPACE}/disk-report.txt"
          {
            echo ""
            echo "=============================================="
            echo "=== AFTER compile  $(date -u +%FT%TZ) ==="
            echo "=============================================="
            df -h / || true
            df -h "${ARMBIAN_BUILD_DIR}" || true
            [ -d /mnt ] && df -h /mnt || true
            echo "--- du key dirs (after) ---"
            du -sh "${ARMBIAN_BUILD_DIR}/cache/sources" 2>/dev/null || true
            du -sh "${ARMBIAN_BUILD_DIR}/cache" 2>/dev/null || true
            du -sh "${ARMBIAN_BUILD_DIR}/output" 2>/dev/null || true
            du -sh "${ARMBIAN_BUILD_DIR}/userpatches" 2>/dev/null || true
            du -sh /var/lib/docker 2>/dev/null || true
            echo "--- output/images ---"
            ls -la "${ARMBIAN_BUILD_DIR}/output/images" 2>/dev/null || true
          } | tee -a "$REPORT" || true

          echo ""
          echo "--- full disk-report.txt ---"
          cat "$REPORT" 2>/dev/null || true

      - name: Upload disk diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disk-report-${{ github.run_number }}
          path: ${{ github.workspace }}/disk-report.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armbian-build-output-${{ github.run_number }}
          path: |
            ${{ env.ARMBIAN_BUILD_DIR }}/output/images
            ${{ env.ARMBIAN_BUILD_DIR }}/compile.log
          retention-days: 14
          if-no-files-found: ignore

# ============================================================
# Job 3: assemble — boot.img + rootfs fstab patch + verify + upload
# (和 Round 2 一样, 不动)
# ============================================================
  assemble:
    name: "assemble: boot.img + verify + upload"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [build-armbian]
    if: needs.build-armbian.outputs.exit_code == '0' && github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install assemble deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
              device-tree-compiler kpartx gdisk fdisk e2fsprogs \
              dosfstools mtools python3-pyelftools

      - name: Download Armbian output
        uses: actions/download-artifact@v4
        with:
          name: armbian-build-output-${{ github.run_number }}
          path: armbian-output

      - name: Find and decompress rootfs img
        id: decompress
        run: |
          echo "=== Downloaded ==="
          find armbian-output -type f

          XZ_OR_IMG=$(find armbian-output -type f \( -name "*.img.xz" -o -name "*.img" \) | head -1)
          if [[ -z "$XZ_OR_IMG" ]]; then
              echo "NO ROOTFS IMG FOUND"
              echo "Assemble job aborted (build-armbian may have failed)."
              exit 1
          fi

          if [[ "$XZ_OR_IMG" == *.xz ]]; then
              echo "Decompressing .img.xz ..."
              xz -k -d "$XZ_OR_IMG"
              ROOTFS="${XZ_OR_IMG%.xz}"
          else
              ROOTFS="$XZ_OR_IMG"
          fi

          echo "ROOTFS=${ROOTFS}" >> "$GITHUB_OUTPUT"
          echo "Rootfs img: $(stat -c%s "$ROOTFS") bytes"

      - name: Build boot.img (FAT32 + kernel + dtb + extlinux.conf)
        run: |
          ROOTFS="${{ steps.decompress.outputs.ROOTFS }}"

          dd if=/dev/zero of=boot.img bs=1M count=64 status=none
          mkfs.fat -F 32 -n UFI003_BOOT boot.img >/dev/null 2>&1

          BOOT_LOOP=$(sudo losetup -fP --show boot.img)
          ROOTFS_LOOP=$(sudo losetup -fP --show "$ROOTFS")
          BOOT_M=/mnt/ufi003-boot
          ROOT_M=/mnt/ufi003-rootfs
          sudo mkdir -p "$BOOT_M" "$ROOT_M"
          sudo mount "$BOOT_LOOP" "$BOOT_M"
          sudo mount "${ROOTFS_LOOP}p1" "$ROOT_M" 2>/dev/null || sudo mount "$ROOTFS_LOOP" "$ROOT_M"

          # kernel
          if find "$ROOT_M/boot" -maxdepth 1 -name "Image" | grep -q .; then
              sudo cp "$ROOT_M/boot/Image" "$BOOT_M/"
          else
              KERNEL=$(ls "$ROOT_M/boot"/vmlinuz-* 2>/dev/null | head -1)
              [[ -n "$KERNEL" ]] && sudo cp "$KERNEL" "$BOOT_M/Image"
          fi

          # initrd
          INITRD=$(find "$ROOT_M/boot" -maxdepth 1 -name "initrd*" | head -1)
          [[ -n "$INITRD" ]] && sudo cp "$INITRD" "$BOOT_M/initrd.img" || true

          # dtb
          sudo mkdir -p "$BOOT_M/dtb/qcom"
          DTB=$(find "$ROOT_M" -path "*/dtb/qcom/*openstick*ufi003*.dtb" -o -path "*/dtb/qcom/msm8916*.dtb" 2>/dev/null | head -1)
          if [[ -n "$DTB" ]]; then
              sudo cp "$DTB" "$BOOT_M/dtb/qcom/"
              DTB_NAME=$(basename "$DTB")
          else
              dtc -I dts -O dtb -o "$BOOT_M/dtb/qcom/msm8916-handsome-openstick-ufi003.dtb" \
                  msm8916-handsome-openstick-ufi003-armbian.dts
              DTB_NAME="msm8916-handsome-openstick-ufi003.dtb"
          fi

          # extlinux.conf — printf 拼接, 缩进安全
          sudo mkdir -p "$BOOT_M/extlinux"
          printf '%s\n' \
              '# extlinux.conf — UFI003 OpenStick (no-modem Armbian)' \
              '# lk2nd bootloader reads this directly' \
              '' \
              'label Armbian' \
              '    kernel /Image' \
              '    initrd /initrd.img' \
              "    fdt /dtb/qcom/${DTB_NAME}" \
              '    append earlycon root=/dev/disk/by-partlabel/rootfs console=ttyMSM0,115200 rootwait no_framebuffer=true rw' \
              '' \
              'label Armbian (rescue)' \
              '    kernel /Image' \
              '    initrd /initrd.img' \
              "    fdt /dtb/qcom/${DTB_NAME}" \
              '    append earlycon root=/dev/disk/by-partlabel/rootfs console=ttyMSM0,115200 rootwait no_framebuffer=true rw single' \
              '' \
              | sudo tee "$BOOT_M/extlinux/extlinux.conf" >/dev/null

          echo "=== Generated extlinux.conf ==="
          cat "$BOOT_M/extlinux/extlinux.conf"

          sudo sync
          sudo umount "$BOOT_M"
          sudo umount "${ROOTFS_LOOP}p1" 2>/dev/null || sudo umount "$ROOT_M"
          sudo losetup -d "$BOOT_LOOP"
          sudo losetup -d "$ROOTFS_LOOP"

          mkdir -p output/fastboot
          cp boot.img output/fastboot/boot.img
          cp "$ROOTFS" output/fastboot/rootfs.img

      - name: Patch rootfs /etc/fstab (PARTLABEL=rootfs)
        run: |
          ROOTFS="${{ steps.decompress.outputs.ROOTFS }}"
          ROOTFS_LOOP=$(sudo losetup -fP --show "$ROOTFS")
          ROOT_M=/mnt/ufi003-rootfs-edit
          sudo mkdir -p "$ROOT_M"
          sudo mount "${ROOTFS_LOOP}p1" "$ROOT_M" 2>/dev/null || sudo mount "$ROOTFS_LOOP" "$ROOT_M"

          printf '%s\n' \
              '# UFI003 Armbian /etc/fstab' \
              'PARTLABEL=rootfs / ext4 defaults,noatime,errors=remount-ro 0 1' \
              'proc /proc proc defaults 0 0' \
              'tmpfs /tmp tmpfs defaults,nosuid,nodev,size=512m 0 0' \
              'devtmpfs /dev devtmpfs defaults,mode=0755,nosuid 0 0' \
              | sudo tee "$ROOT_M/etc/fstab" >/dev/null

          echo "=== Patched fstab ==="
          cat "$ROOT_M/etc/fstab"

          sudo sync
          sudo umount "${ROOTFS_LOOP}p1" 2>/dev/null || sudo umount "$ROOT_M"
          sudo losetup -d "$ROOTFS_LOOP"

      - name: Verify artifacts
        run: |
          BOOT_IMG="output/fastboot/boot.img"
          ROOTFS_IMG="output/fastboot/rootfs.img"
          PASS=0; FAIL=0

          boop() { if eval "$1" 2>/dev/null; then echo "  OK: $2"; PASS=$((PASS+1)); else echo "  FAIL: $2"; FAIL=$((FAIL+1)); fi; }

          boop "[ -f '$BOOT_IMG' ] && [ \$(stat -c%s '$BOOT_IMG') -le 67108864 ]" "boot.img <= 64MB"
          boop "[ -f '$ROOTFS_IMG' ]" "rootfs.img exists"
          boop "file '$BOOT_IMG' | grep -qi 'FAT'" "boot.img is FAT"
          boop "file '$ROOTFS_IMG' | grep -qi 'ext4'" "rootfs.img is ext4"

          BOOT_LOOP=$(sudo losetup -fP --show "$BOOT_IMG")
          ROOTFS_LOOP=$(sudo losetup -fP --show "$ROOTFS_IMG")
          BOOT_M=/mnt/vb; ROOT_M=/mnt/vr
          sudo mkdir -p "$BOOT_M" "$ROOT_M"
          sudo mount "$BOOT_LOOP" "$BOOT_M"
          sudo mount "${ROOTFS_LOOP}p1" "$ROOT_M" 2>/dev/null || sudo mount "$ROOTFS_LOOP" "$ROOT_M"

          boop "[ -f '$BOOT_M/Image' ]" "boot has kernel"
          boop "[ -f '$BOOT_M/extlinux/extlinux.conf' ]" "boot has extlinux.conf"
          boop "find '$BOOT_M' -name '*.dtb' | grep -q ." "boot has dtb"
          boop "grep -q 'PARTLABEL=rootfs' '$BOOT_M/extlinux/extlinux.conf'" "extlinux has PARTLABEL"
          boop "grep -q 'PARTLABEL=rootfs' '$ROOT_M/etc/fstab'" "rootfs fstab correct"
          boop "[ -f '$ROOT_M/sbin/init' ]" "rootfs has systemd"

          sudo umount "$BOOT_M"
          sudo umount "${ROOTFS_LOOP}p1" 2>/dev/null || sudo umount "$ROOT_M"
          sudo losetup -d "$BOOT_LOOP"
          sudo losetup -d "$ROOTFS_LOOP"

          echo ""
          echo "PASS=$PASS FAIL=$FAIL"
          [[ $FAIL -eq 0 ]] || exit 1

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "ufi003-armebian-${{ github.run_number }}"
          path: |
            output/fastboot/boot.img
            output/fastboot/rootfs.img
          retention-days: 30
          if-no-files-found: error

      - name: Upload tools + source (reference)
        uses: actions/upload-artifact@v4
        with:
          name: "ufi003-tools-${{ github.run_number }}"
          path: |
            config/
            userpatches/
            scripts/
            msm8916-handsome-openstick-ufi003-armbian.dts
            flash-fastboot.sh
            flash-edl.sh
            verify-image.sh
            FINAL_ANSWERS.md
            ufi003-armbian-build-guide.md
          retention-days: 30
          if-no-files-found: warn
