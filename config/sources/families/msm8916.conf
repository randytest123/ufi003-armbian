#
# MSM8916 (Qualcomm Snapdragon 410) 家族 — 无 modem 版
# 适用: UFI001B, UFI001C, UFI003, UFIW001, UFI103S, UFI16V3, SP970, UZ801
# 启动链: lk1st → lk2nd (OpenStick) → extlinux.conf → kernel+DTB → rootfs
#
# 选择策略 (已确定):
#   主线内核 + userpatches 加 openstick DTS
#   原因: openstick fork 基于主线但维护松散 (5.15停了),
#         主线 6.12/7.x 有更好驱动支持, 加一个 DTS patch 工作量最小
#
# 实测确认:
#   DTB名: msm8916-handsome-openstick-ufi003.dtb
#   compatible: "handsome,openstick", "qcom,msm8916"
#   boot cmdline: earlycon root=PARTLABEL=rootfs console=ttyMSM0,115200 no_framebuffer=true rw
#   WiFi: WCN3620 via pronto-v2-pil remoteproc@a21b000
#   Modem: mss-pil remoteproc@4080000 — disabled (无固件)
#
declare -g LINUXFAMILY="msm8916"
declare -g ARCH="arm64"
declare -g OVERLAY_DIR="/boot/dtb/qcom/overlay"
declare -g SERIALCON="ttyMSM0:115200"
declare -g DEFAULT_CONSOLE="serial"

# 使用主线内核 + userpatches DTS patch
case $BRANCH in
	current)
		declare -g KERNEL_MAJOR_MINOR="6.12"
		declare -g KERNELBRANCH='branch:linux-6.12.y'
		declare -g KERNELSOURCE="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
		;;
	edge)
		declare -g KERNEL_MAJOR_MINOR="7.2"
		declare -g KERNELBRANCH='branch:linux-7.2.y'
		declare -g KERNELSOURCE="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
		;;
esac

# --------------------------------------------------------------------------
# KERNEL_DEFCONFIG — armbian-next 不再使用此变量!
#
# 旧版 armbian 用 KERNEL_DEFCONFIG 决定 make <defconfig> 的目标名称.
# armbian-next (2025+) 重构后用 prepare_kernel_config_core_or_userpatches
# 函数 (kernel-config.sh L8-21) 直接查找完整 .config 文件, 不再做 defconfig.
#
# 另外, 主线 Linux arm64/configs/ 目录 (arch/arm64/configs/) 只有三个文件:
#   defconfig, hardening.config, virt.config
# 根本没有 msm8916_defconfig! Qualcomm msm8916 用 arm64 通用 defconfig.
# 我们在 scripts/gen-kernel-config.sh 里用 make ARCH=arm64 defconfig.
# --------------------------------------------------------------------------
# declare -g KERNEL_DEFCONFIG="msm8916_defconfig"  # 已注释 — armbian-next 不用

# Armbian userpatches/kernel/ 目录下的 patch 会被自动应用到内核
# 这个 patch 加 openstick DTS + 默认禁用 modem
# 文件: userpatches/kernel/add-openstick-dts-ufi003-nomodem.patch

# 没有 U-Boot — 用 lk2nd (外部 bootloader), 走 extlinux.
#
# 不要再声明 BOOTSCRIPT:
#   armbian-next 的 distro-agnostic.sh L259-273 对非 *.template 的 bootscript 只是
#   `cp -pv config/bootscripts/x.sh -> /boot/<dst>`, 不会执行它, 结果是 /boot 里
#   躺着一个 shell 脚本冒充 extlinux.conf. 走 extlinux 的板子应该设
#   SRC_EXTLINUX="yes" (已在 config/boards/ufi003.csc 里声明), armbian 会生成
#   真正的 extlinux.conf, 并且 armbian-bsp-cli-deb.sh L335 本来就会忽略 BOOTSCRIPT.
# config/bootscripts/bootscript-msm8916.sh 因此不再被使用 (保留作参考).
declare -g BOOTCONFIG="none"
declare -g HAS_VIDEO_OUTPUT="no"

# --------------------------------------------------------------------------
# KERNEL_CONFIG_FRAGMENTS — armbian-next 不再使用此变量!
#
# 旧版 armbian 会自动把 KERNEL_CONFIG_FRAGMENTS 里列出的文件与 defconfig
# 合并. armbian-next (2025+) 重构后这个机制被移除.
# kernel-config.sh 的关键路径 (prepare_kernel_config_core_or_userpatches,
# kernel_config_initialize, call_extensions_kernel_config) 里都没有引用它.
#
# 我们的 msm8916.config fragment 由 scripts/gen-kernel-config.sh 手动读取
# 并追加到 .config. 注释掉 KERNEL_CONFIG_FRAGMENTS 避免误导.
# --------------------------------------------------------------------------
# v6.12 arm64 defconfig 里已开启 WCN36XX=m, 大部分 WiFi/USB/gpio 驱动.
# 我们的 fragment 只追加:
#   CONFIG_REMOTEPROC=y + CONFIG_QCOM_WCNSS_PIL=m — WCNSS WiFi PIL loader
#   CONFIG_RPMSG_QCOM_SMD=m — SMD 通信通道
#   CONFIG_USB_CONFIGFS=y + CONFIG_USB_CONFIGFS_RNDIS/ACM=y — USB gadget
#   CONFIG_MMC_SDHCI_PLTFM=y — eMMC
# 完整列表见 config/sections/msm8916.config
# KERNEL_CONFIG_FRAGMENTS+=(           # armbian-next 不用 — 脚本手动处理
#     "config/sections/msm8916.config"
# )

# 内核模块 (WiFi + USB gadget)
declare -g MODULES="cfg80211 mac80211 ath wcn36xx rndis_host cdc_acm usb_f_rndis usb_f_acm configfs"

function post_family_config__msm8916() {
	display_alert "MSM8916 family" "Applying msm8916-specific config" "info"

	# CPU: 保守基线, 不用超频 opp
	declare -g CPUMAX="1200000"
	declare -g CPUMIN="400000"
	declare -g GOVERNOR="schedutil"
	declare -g HAS_VIDEO_OUTPUT="no"

	display_alert "MSM8916" "Governor: schedutil, CPU 0.4-1.2GHz" "info"
}

# 内核编译后 DTB 处理 (Armbian 自动从 dtb 复制)
# userpatches DTS patch 已经让 msm8916-handsome-openstick-ufi003.dtb 编进内核
# 编译后 dtb 在 arch/arm64/boot/dts/qcom/ 下
# BOOT_FDT_FILE="qcom/msm8916-handsome-openstick-ufi003.dtb" 告诉 Armbian 复制哪个
