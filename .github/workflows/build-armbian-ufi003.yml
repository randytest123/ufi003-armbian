# =============================================================================
# UFI003 OpenStick (no-modem) — Armbian 构建 Workflow
# GitHub Actions ubuntu-24.04 runner
# =============================================================================
# ROUND 3 修复 (在 Round 2 基础上修 3 处致命问题):
#
#   A. defconfig 名称错误 + pipefail 缺失:
#      Round 2 两处写 `make msm8916_defconfig | tail -5` —
#      主线 Linux arm64/configs/ 只有 defconfig, hardening.config, virt.config
#      三个文件! 根本没有 msm8916_defconfig!
#      这条 make 必然失败, 但 | tail -5 吞了错误 (没开 pipefail),
#      导致 .config 是空的, olddefconfig 补成几乎全默认值的配置,
#      结果就是 "编译成功但开不了机".
#      修复: 抽成 scripts/gen-kernel-config.sh, 用 make defconfig,
#      set -euo pipefail, 所有步骤失败立即终止.
#
#   B. 加硬校验:
#      make defconfig 后立即校验 CONFIG_ARCH_QCOM=y,
#      olddefconfig 后校验 CONFIG_ARCH_QCOM + CONFIG_EXT4_FS + CONFIG_BLK_DEV_INITRD
#      + CONFIG_ 总数 > 3000, 打印 fragment 里的关键项实际值.
#      任何一项不满足直接 exit 1.
#
#   C. 双份生成逻辑抽成单一脚本:
#      prepare 和 build 两个 job 都调用 scripts/gen-kernel-config.sh,
#      避免两处独立实现以后改一处漏一处.
#
# 关键源码参考 (armbian/build @ 815a50b6, 2026-07-11):
#   prepare_kernel_config_core_or_userpatches:
#     优先级 1: userpatches/linux-$FAMILY-$BRANCH.config
#     优先级 2: userpatches/config/kernel/linux-$FAMILY-$BRANCH.config  ← 我们放这里
#     优先级 3: armbian/config/kernel/linux-$FAMILY-$BRANCH.config
#   kernel-config.sh L8-21
#
# arm64 主线 defconfig 参考:
#   https://github.com/torvalds/linux/tree/v6.12/arch/arm64/configs
#   (只有 defconfig, hardening.config, virt.config — 没有 SoC-specific 的)
# =============================================================================

name: Build UFI003 OpenStick Armbian (no-modem)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "内核分支 (current=6.12, edge=7.2)"
        required: false
        default: "current"
        type: choice
        options:
          - current
          - edge
      release:
        description: "发行版"
        required: false
        default: "bookworm"
        type: choice
        options:
          - bookworm
          - noble
      build_minimal:
        description: "最小化 rootfs (更快)"
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"

  push:
    branches: [main]

  pull_request:
    branches: [main]

concurrency:
  group: ufi003-build-${{ github.ref }}
  cancel-in-progress: false

env:
  BOARD: ufi003
  KERNEL_CONFIGURE: no
  # Round 10b: armbian_kernel_config__600_enable_ebpf_and_btf_info() 在 KERNEL_BTF!=no 时
  # 会强制 DEBUG_INFO / DEBUG_INFO_DWARF5 / DEBUG_INFO_BTF / DEBUG_INFO_BTF_MODULES=y.
  # .BTF 是 alloc 段, 会直接进 arm64 Image, 体积暴涨. 我们只需要 <= 28 MiB, 不要 BTF/CO-RE.
  KERNEL_BTF: "no"
  EXPERT: no
  # Round 5: 关掉 xz 压缩 — armbian 的 compress-checksum.sh 用子串匹配 (*xz* / *zst* / *sha*),
  # 空值 = 不压缩不校验, 直接留下 .img 原文件, 省掉一份全尺寸临时文件 + xz 工作内存.
  # assemble job 已支持 .img / .img.xz 两种输入 (L466 find 两种后缀).
  COMPRESS_OUTPUTIMAGE: ""
  MAKEFLAGS: "-j2"
  DEBIAN_FRONTEND: noninteractive
  ARMBIAN_BUILD_DIR: ${{ github.workspace }}/armbian-build
  KERNEL_CONFIG_DIR: ${{ github.workspace }}/kernel-configs

jobs:

# ============================================================
# Job 1: prepare — deps + armbian clone + 生成完整 kernel .config
# 作用:
#   - 验证 kernel clone + defconfig + fragment merge 可行
#   - 生成完整 .config 并上传 artifact 供 debug
# ============================================================
  prepare:
    name: "prepare: deps + config + kernel .config"
    # Round 7: 改用 arm64 原生 runner (公开仓库免费, ubuntu-24.04-arm)。
    # 依据 armbian/build lib/functions/host/host-release.sh L15-16:
    #   case "${HOSTARCH}" in amd64 | arm64) ;;   # officially supported
    # 在 aarch64 宿主上 chroot 进 arm64 rootfs 是原生的, 不需要 qemu-user-static,
    # 内核也按 HOSTARCH==ARCH 走原生工具链 (不再需要 CROSS_COMPILE)。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps (native arm64 toolchain)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
              build-essential \
              bison flex patch bc jq wget curl rsync xz-utils p7zip-full pigz \
              device-tree-compiler uuid-dev libssl-dev libncurses-dev libxml2-dev libxml2-utils \
              liblz4-tool lzop ccache swig time libelf-dev dwarves \
              python3-dev python3-pyelftools python3-setuptools \
              git gnupg2 u-boot-tools fdisk gdisk pahole git-lfs
          # Round 7: 不再安装 qemu-user-static / binfmt-support / gcc-aarch64-linux-gnu
          # (arm64 宿主 = 目标架构, 原生执行, 无需二进制翻译和交叉编译)

      - name: Clone armbian/build
        run: |
          git clone --depth 1 --branch main https://github.com/armbian/build.git "${ARMBIAN_BUILD_DIR}"
          echo "Clone OK: $(du -sh "${ARMBIAN_BUILD_DIR}" | cut -f1)"

      - name: Install our board configs into armbian/build
        run: |
          mkdir -p \
              "${ARMBIAN_BUILD_DIR}/config/boards" \
              "${ARMBIAN_BUILD_DIR}/config/sources/families" \
              "${ARMBIAN_BUILD_DIR}/config/bootscripts" \
              "${ARMBIAN_BUILD_DIR}/userpatches/kernel" \
              "${ARMBIAN_BUILD_DIR}/userpatches/kernel/archive/msm8916-6.12"

          cp config/boards/ufi003.csc                 "${ARMBIAN_BUILD_DIR}/config/boards/"
          cp config/sources/families/msm8916.conf     "${ARMBIAN_BUILD_DIR}/config/sources/families/"
          cp config/bootscripts/bootscript-msm8916.sh  "${ARMBIAN_BUILD_DIR}/config/bootscripts/"
          # Round 10b: config/sections 不是 armbian 的读取路径, 这行 cp 是死代码,
          # msm8916.config 只作为 gen-kernel-config.sh 的 --fragment 输入,
          # 最终生效的是 userpatches/linux-msm8916-current.config (优先级 1).
          cp scripts/gen-kernel-config.sh             "${ARMBIAN_BUILD_DIR}/scripts/" 2>/dev/null || true
          # patch 放根目录 (无害, 不会被扫) + 真正生效的位置
          cp userpatches/kernel/add-openstick-dts-ufi003-nomodem.patch \
             "${ARMBIAN_BUILD_DIR}/userpatches/kernel/"
          # 关键: armbian 只扫 userpatches/kernel/<KERNELPATCHDIR>/,
          # KERNELPATCHDIR=archive/msm8916-6.12 (日志: "KERNELPATCHDIR is unset; using 'archive/msm8916-6.12'")
          cp userpatches/kernel/add-openstick-dts-ufi003-nomodem.patch \
             "${ARMBIAN_BUILD_DIR}/userpatches/kernel/archive/msm8916-6.12/"
          echo "=== kernel patches in archive/msm8916-6.12 ==="
          ls -la "${ARMBIAN_BUILD_DIR}/userpatches/kernel/archive/msm8916-6.12/"
          cp msm8916-handsome-openstick-ufi003-armbian.dts \
             "${ARMBIAN_BUILD_DIR}/userpatches/" 2>/dev/null || true

      # ---- Round 3: 调统一脚本生成 .config ----
      # 这里和 build job 的对应 step 调同一个脚本, 行为完全一致.
      # 脚本内部 set -euo pipefail, 任何 defconfig/olddefconfig/校验失败立即 exit 1.
      - name: Generate full kernel .config (via scripts/gen-kernel-config.sh)
        run: |
          BRANCH="${{ inputs.branch || 'current' }}"

          bash scripts/gen-kernel-config.sh \
              --branch "$BRANCH" \
              --fragment "config/sections/msm8916.config" \
              --output-dir "${ARMBIAN_BUILD_DIR}/userpatches" \
              --output-dir "${ARMBIAN_BUILD_DIR}/userpatches/config/kernel"

      - name: Quick sanity check — Armbian can see our board + kernel config
        run: |
          cd "${ARMBIAN_BUILD_DIR}"
          echo "=== Board KERNEL_TARGET check ==="
          grep -q 'KERNEL_TARGET="current,edge"' config/boards/ufi003.csc && echo "OK: KERNEL_TARGET allows current" || { echo "FAIL: KERNEL_TARGET"; exit 1; }
          echo ""
          echo "=== Kernel config file present in userpatches ==="
          ls -la userpatches/config/kernel/
          echo ""
          echo "=== Done prepare ==="

# ============================================================
# Job 2: compile.sh — 正式构建
# ============================================================
  build-armbian:
    name: "build: armbian compile.sh"
    # Round 7: arm64 原生 runner (公开仓库免费)。
    # 宿主架构 = 目标架构 → 容器内 chroot 进 arm64 rootfs 不需要 qemu-user-static,
    # "getline (12: Cannot allocate memory)" 这一整类 qemu-user ENOMEM 从根上消失。
    # 已核验: armbian 的多架构构建镜像 ghcr.io/armbian/docker-armbian-build:
    #   armbian-debian-trixie-latest 是 manifest list, 含 linux/amd64, linux/arm64,
    #   linux/riscv64 → arm64 runner 上 pull 到的是原生 arm64 层, 连 docker 层都没有模拟。
    # 标准 runner 规格: 4 vCPU / 16 GiB RAM, 磁盘与 x64 标准 runner 同规格
    #   (本项目在 x64 上实测 df / = 145G, 110 GiB 空闲)。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    needs: [prepare]
    if: github.event_name != 'pull_request'

    outputs:
      exit_code: ${{ steps.compile.outputs.exit_code }}
      elapsed_minutes: ${{ steps.compile.outputs.elapsed_minutes }}

    env:
      CCACHE_DIR: ${{ github.workspace }}/ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Round 7: 删掉了 "Free up disk space" / "Relocate heavy dirs to /mnt" / 12GiB gate.
      # 原因: 实测这台标准 runner 是 145G 盘 (编译前后 110→91 GiB 空闲), 磁盘从来不是瓶颈;
      # 而且 armbian 自己在 prepare-host.sh L340-353 有 10GiB 硬阈值的 fail-fast 检查,
      # 真不够会立刻 exit 43, 不需要我们再守一道门。

      - name: Install deps (native arm64 toolchain)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
              bison flex patch bc jq wget curl rsync xz-utils p7zip-full pigz \
              device-tree-compiler uuid-dev libssl-dev libncurses-dev libxml2-dev libxml2-utils \
              liblz4-tool lzop ccache swig time \
              python3-dev python3-pyelftools python3-setuptools \
              git gnupg2 u-boot-tools fdisk gdisk kpartx dwarves pahole

      # ccache 保持关闭: 首次全量编译命中率低, 缓存包反而占空间/时间。

      - name: Clone armbian/build + install configs
        run: |
          git clone --depth 1 --branch main https://github.com/armbian/build.git "${ARMBIAN_BUILD_DIR}"

          mkdir -p \
              "${ARMBIAN_BUILD_DIR}/config/boards" \
              "${ARMBIAN_BUILD_DIR}/config/sources/families" \
              "${ARMBIAN_BUILD_DIR}/config/bootscripts" \
              "${ARMBIAN_BUILD_DIR}/userpatches/kernel" \
              "${ARMBIAN_BUILD_DIR}/userpatches/kernel/archive/msm8916-6.12" \
              "${ARMBIAN_BUILD_DIR}/userpatches/config/kernel"

          cp config/boards/ufi003.csc                 "${ARMBIAN_BUILD_DIR}/config/boards/"
          cp config/sources/families/msm8916.conf     "${ARMBIAN_BUILD_DIR}/config/sources/families/"
          cp config/bootscripts/bootscript-msm8916.sh  "${ARMBIAN_BUILD_DIR}/config/bootscripts/"
          # Round 10b: config/sections 不是 armbian 的读取路径, 不往 armbian 里拷;
          # 它只作为 gen-kernel-config.sh 的 --fragment 输入.
          # patch 放根目录 (无害, 不会被扫) + 真正生效的位置
          cp userpatches/kernel/add-openstick-dts-ufi003-nomodem.patch \
             "${ARMBIAN_BUILD_DIR}/userpatches/kernel/"
          # 关键: armbian 只扫 userpatches/kernel/<KERNELPATCHDIR>/,
          # KERNELPATCHDIR=archive/msm8916-6.12 (日志: "KERNELPATCHDIR is unset; using 'archive/msm8916-6.12'")
          cp userpatches/kernel/add-openstick-dts-ufi003-nomodem.patch \
             "${ARMBIAN_BUILD_DIR}/userpatches/kernel/archive/msm8916-6.12/"
          echo "=== kernel patches in archive/msm8916-6.12 ==="
          ls -la "${ARMBIAN_BUILD_DIR}/userpatches/kernel/archive/msm8916-6.12/"
          cp msm8916-handsome-openstick-ufi003-armbian.dts \
             "${ARMBIAN_BUILD_DIR}/userpatches/" 2>/dev/null || true

          git config --global --add safe.directory /github/workspace/armbian-build 2>/dev/null || true

      # ============================================================
      # Round 3: build job 也调同一个脚本生成 .config
      # 不依赖 prepare artifact — build job 自己生成, 更健壮.
      # 脚本内部 set -euo pipefail, 任何失败立即 exit 1.
      # ============================================================
      - name: Generate full kernel .config (via scripts/gen-kernel-config.sh)
        run: |
          BRANCH="${{ inputs.branch || 'current' }}"

          bash scripts/gen-kernel-config.sh \
              --branch "$BRANCH" \
              --fragment "config/sections/msm8916.config" \
              --output-dir "${ARMBIAN_BUILD_DIR}/userpatches" \
              --output-dir "${ARMBIAN_BUILD_DIR}/userpatches/config/kernel"

          echo ""
          echo "=== Verify installed .config ==="
          CONFIG_NAME="linux-msm8916-${BRANCH}.config"
          ls -la "${ARMBIAN_BUILD_DIR}/userpatches/${CONFIG_NAME}"
          ls -la "${ARMBIAN_BUILD_DIR}/userpatches/config/kernel/${CONFIG_NAME}"

      # ============================================================
      # Round 7: 这里原来的 "Host tuning for qemu-user (overcommit)" 已删除。
      #
      # Round 6 的结论 (overcommit) 是错的: 上一轮 vm.overcommit_memory=1 已生效,
      # 但本轮仍然在同一步 (apt_lists_copy_from_host_to_image_and_update,
      # apt-install.sh:67) 报 getline ENOMEM(12)。
      # 真实条件是: x86_64 容器里用 qemu-aarch64-static 跑 arm64 apt, 且 rootfs
      # 建在 tmpfs 上(日志 L23935 "Using tmpfs for rootfs build")。
      # 这类"guest 系统调用 → 宿主 read()/mmap 返回 ENOMEM"的问题没有确定性参数可调,
      # 消掉它唯一可靠的办法是让 qemu 彻底不参与 —— 即 arm64 原生 runner。
      # ============================================================

      # Round 7: 原来的 "Dump apt sources" 和 "12GiB disk gate" 都删掉了:
      #   - 源: 失败与源内容无关 (curl 该 InRelease = HTTP 200 / 6225 字节 / 合法 PGP),
      #         且原生 arm64 宿主上完全不会触发;
      #   - gate: armbian 自己在 prepare-host.sh L340-353 有 10GiB fail-fast (exit 43),
      #         实测机器 110GiB 空闲, 再守一道门只是增加复杂度。
      - name: Snapshot disk before compile
        run: |
          REPORT="${GITHUB_WORKSPACE}/disk-report.txt"
          {
            echo "=== BEFORE compile  $(date -u +%FT%TZ) ==="
            df -h / || true
            df -h "${ARMBIAN_BUILD_DIR}" || true
            du -sh "${ARMBIAN_BUILD_DIR}" 2>/dev/null || true
            du -sh /var/lib/docker 2>/dev/null || true
          } | tee "$REPORT"

      # ============================================================
      # compile.sh — 不套 sudo, 直接跑 (runner 默认 root)
      # pipefail 保证 tee 不吞退出码
      # ============================================================
      - name: Run compile.sh (no sudo, pipefail, hard img check)
        id: compile
        run: |
          cd "${ARMBIAN_BUILD_DIR}"

          BRANCH="${{ inputs.branch || 'current' }}"
          RELEASE="${{ inputs.release || 'bookworm' }}"
          BUILD_MINIMAL="${{ inputs.build_minimal || 'yes' }}"

          echo "=== Parameters ==="
          echo "  BOARD=${BOARD} BRANCH=${BRANCH} RELEASE=${RELEASE} MINIMAL=${BUILD_MINIMAL}"
          echo "  MAKEFLAGS=${MAKEFLAGS}"
          echo "  ARMBIAN_BUILD_DIR=${ARMBIAN_BUILD_DIR}"
          echo "  USER=$(whoami) UID=$(id -u)"
          echo ""

          # pipefail: tee 不吞 exit code
          set -o pipefail

          START_TS=$(date +%s)
          {
            # 不套 sudo: GitHub runner 的默认用户是 runner (非 root), 有 passwordless sudo.
            # compile.sh 检测到 EUID != 0 且 Docker 可用时, 会自己 relaunch 到 Docker 容器
            # (utils-cli.sh L302-329: cli_standard_relaunch_docker_or_sudo, PREFER_DOCKER 默认 yes).
            # 日志里的 "Docker run failed" 前缀 [🐳|...] 就是这个机制.
            # 如果套 sudo 会走进 EUID==0 分支, 触发 "don't run ./compile.sh as root" 的告警路径.
            ./compile.sh \
                BOARD="${BOARD}" \
                BRANCH="${BRANCH}" \
                RELEASE="${RELEASE}" \
                BUILD_MINIMAL="${BUILD_MINIMAL}" \
                KERNEL_CONFIGURE=no \
                EXPERT=no \
                COMPRESS_OUTPUTIMAGE="${COMPRESS_OUTPUTIMAGE}" \
                VERBOSE="no"
          } 2>&1 | tee "${ARMBIAN_BUILD_DIR}/compile.log"
          RC=${PIPESTATUS[0]}
          ELAPSED=$(( ($(date +%s) - START_TS) / 60 ))
          set +o pipefail

          echo ""
          echo "compile.sh exit=${RC}, elapsed=${ELAPSED}min"
          echo ""

          # ---- 硬校验 1: compile.sh 返回码必须 0 ----
          if [[ $RC -ne 0 ]]; then
              echo "=== compile.sh FAILED with exit code ${RC} ==="
              echo ""
              echo "=== Last 150 lines of compile.log ==="
              tail -150 "${ARMBIAN_BUILD_DIR}/compile.log" || true
              echo ""
              exit 1
          fi

          # ---- 硬校验 2: 必须有 rootfs img ----
          echo "=== HARD CHECK: find rootfs img ==="
          echo "output directory contents:"
          find "${ARMBIAN_BUILD_DIR}/output" -maxdepth 3 -type f 2>/dev/null | head -50

          IMG_COUNT=$(find "${ARMBIAN_BUILD_DIR}/output" -type f \( -name "*.img" -o -name "*.img.xz" \) 2>/dev/null | wc -l)
          echo ""
          echo "img files found: ${IMG_COUNT}"
          find "${ARMBIAN_BUILD_DIR}/output" -type f \( -name "*.img" -o -name "*.img.xz" \) 2>/dev/null
          echo ""

          if [[ $IMG_COUNT -eq 0 ]]; then
              echo "FATAL: No .img files found in output directory!"
              echo "Assemble job requires a rootfs image. compile.sh may have succeeded but produced nothing."
              echo "Last 80 lines of compile.log:"
              tail -80 "${ARMBIAN_BUILD_DIR}/compile.log" || true
              echo ""
              exit 1
          fi

          echo ""
          echo "exit_code=0"              >> "$GITHUB_OUTPUT"
          echo "elapsed_minutes=${ELAPSED}" >> "$GITHUB_OUTPUT"
          echo "compile.sh OK, ${IMG_COUNT} img files produced"

      # ============================================================
      # Round 10b: 内核 .config 自证 (只读, 不改门禁)
      # 1) 证明 fragment 真的进了最终内核 config (路径/SHA256/行数/计数/抽查)
      # 2) 打印 vmlinux 最大的 alloc 段, 下一轮按实测数据决定裁哪里
      # ============================================================
      - name: Attest kernel .config + top alloc sections
        run: |
          set -euo pipefail
          CFG=$(find "${ARMBIAN_BUILD_DIR}/cache/sources" -maxdepth 6 -type f -name ".config" -path "*linux-kernel-worktree*" | head -1)
          if [[ -z "${CFG}" ]]; then
              echo "FATAL: kernel .config not found under cache/sources"; exit 1
          fi
          echo "=== kernel .config actually used ==="
          echo "path    : ${CFG}"
          echo "sha256  : $(sha256sum "${CFG}" | cut -d' ' -f1)"
          echo "lines   : $(wc -l < "${CFG}")"
          echo "=y      : $(grep -c '^CONFIG_[A-Z0-9_]*=y' "${CFG}")"
          echo "=m      : $(grep -c '^CONFIG_[A-Z0-9_]*=m' "${CFG}")"
          echo "not-set : $(grep -c '^# CONFIG_[A-Z0-9_]* is not set' "${CFG}")"
          echo ""
          echo "=== spot checks ==="
          for s in CONFIG_CC_OPTIMIZE_FOR_SIZE CONFIG_DEBUG_KERNEL CONFIG_DEBUG_INFO \
                   CONFIG_DEBUG_INFO_DWARF5 CONFIG_DEBUG_INFO_BTF CONFIG_DEBUG_INFO_BTF_MODULES \
                   CONFIG_EFI CONFIG_EFI_STUB CONFIG_ARM64_EFI_ZBOOT \
                   CONFIG_PHY_QCOM_USB_HS CONFIG_USB_CHIPIDEA CONFIG_USB_CHIPIDEA_UDC \
                   CONFIG_USB_CHIPIDEA_MSM CONFIG_USB_GADGET CONFIG_USB_CONFIGFS \
                   CONFIG_USB_CONFIGFS_RNDIS CONFIG_USB_CONFIGFS_ACM \
                   CONFIG_ARM64_VA_BITS CONFIG_ARM64_PA_BITS; do
              v=$(grep -E "^${s}=" "${CFG}" || true)
              if [[ -z "${v}" ]]; then v=$(grep -E "^# ${s} is not set" "${CFG}" || true); fi
              if [[ -z "${v}" ]]; then v="(absent)"; fi
              echo "  ${s} -> ${v}"
          done
          echo ""
          echo "=== HARD ASSERT ==="
          grep -q '^CONFIG_CC_OPTIMIZE_FOR_SIZE=y' "${CFG}" \
              || { echo "FATAL: CONFIG_CC_OPTIMIZE_FOR_SIZE != y (-Os 没进最终 config)"; exit 1; }
          if grep -q '^CONFIG_DEBUG_INFO_BTF=y' "${CFG}"; then
              echo "FATAL: CONFIG_DEBUG_INFO_BTF=y (KERNEL_BTF=no 没生效)"; exit 1
          fi
          echo "OK: -Os=y, BTF off"
          echo ""
          echo "=== Round 11 HARD ASSERT (USB 全内建 + 48-bit VA) ==="
          for s in CONFIG_PHY_QCOM_USB_HS CONFIG_USB_CHIPIDEA CONFIG_USB_CHIPIDEA_UDC \
                   CONFIG_USB_CHIPIDEA_MSM CONFIG_USB_GADGET CONFIG_USB_CONFIGFS \
                   CONFIG_USB_CONFIGFS_RNDIS CONFIG_USB_CONFIGFS_ACM; do
              grep -q "^${s}=y" "${CFG}" \
                  || { echo "FATAL: ${s} != y (USB 未内建, 开机早期不会有网卡)"; exit 1; }
          done
          grep -q '^CONFIG_ARM64_VA_BITS=48' "${CFG}" \
              || { echo "FATAL: CONFIG_ARM64_VA_BITS != 48 (未对齐原厂 2.1)"; exit 1; }
          echo "OK: USB all =y, VA_BITS=48"
          echo ""
          echo "=== vmlinux top alloc sections ==="
          VMLINUX=$(find "${ARMBIAN_BUILD_DIR}/cache/sources" -maxdepth 6 -type f -name "vmlinux" -path "*linux-kernel-worktree*" | head -1)
          if [[ -n "${VMLINUX}" ]]; then
              echo "vmlinux : ${VMLINUX} ($(stat -c%s "${VMLINUX}") B)"
              readelf -SW "${VMLINUX}" | python3 -c "import re,sys; L=[re.match(r'\s*\[\s*\d+\]\s+(\S+)\s+(\S+)\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)\s+(\S+)\s+(\S+)', l) for l in sys.stdin]; R=sorted([(int(m.group(5),16), m.group(1), m.group(2)) for m in L if m and 'A' in m.group(7)], reverse=True); print('  alloc total: %.2f MiB in %d sections' % (sum(x[0] for x in R)/1048576.0, len(R))); [print('  %10.2f MiB  %-24s %s' % (x[0]/1048576.0, x[1], x[2])) for x in R[:12]]"
          else
              echo "WARN: vmlinux not found, skip section dump"
          fi

      # ============================================================
      # Round 9 (A): 定位构建产物里的裸 arm64 Image + 硬断言
      #
      # 根因: 之前 assemble 从 rootfs /boot/Image 取内核, 拿到的是
      # ARM64 PE/EFI 可执行文件 (首字节 'MZ'), aboot 原样搬到
      # 0x80080000 跳转 → 非法指令 → 复位.
      # 现在 CONFIG_EFI/EFI_STUB/ZBOOT 已强制 =n, 必须产出标准裸 Image:
      #   code0 = d503201f (NOP), magic[56:60] = 'ARMd'
      # 任一断言失败 → 构建直接失败 (不再回退到 rootfs /boot/Image).
      # 找到后复制到 output/images/Image, 随 artifact 交给 assemble job.
      # ============================================================
      - name: Locate + assert raw arm64 Image (must NOT be PE/MZ)
        run: |
          set -euo pipefail
          OUT="${ARMBIAN_BUILD_DIR}/output"
          IMG=""

          # 1) armbian-next 构建产物 output/images/Image
          if [[ -f "${OUT}/images/Image" ]]; then
              IMG="${OUT}/images/Image"
              echo "Image source: output/images/Image"
          fi

          # 2) 内核源码树 arch/arm64/boot/Image (armbian 保留 cache/sources)
          if [[ -z "$IMG" ]]; then
              IMG=$(find "${ARMBIAN_BUILD_DIR}/cache/sources" "${OUT}" \
                        -type f -path "*/arch/arm64/boot/Image" 2>/dev/null | head -1 || true)
              [[ -n "$IMG" ]] && echo "Image source: $IMG"
          fi

          # 3) 从 linux-image deb 里取 (仍需通过下面的断言)
          if [[ -z "$IMG" ]]; then
              DEB=$(find "${OUT}/debs" -type f -name 'linux-image-*.deb' 2>/dev/null | head -1 || true)
              if [[ -n "$DEB" ]]; then
                  echo "Image source: extract from ${DEB}"
                  rm -rf /tmp/kdeb && mkdir -p /tmp/kdeb
                  dpkg-deb -x "$DEB" /tmp/kdeb
                  IMG=$(find /tmp/kdeb/boot -maxdepth 1 -type f \( -name Image -o -name 'vmlinuz-*' \) 2>/dev/null | head -1 || true)
                  [[ -n "$IMG" ]] && echo "  extracted: $IMG"
              fi
          fi

          if [[ -z "$IMG" || ! -f "$IMG" ]]; then
              echo "FATAL: no arm64 Image found in build artifacts"
              echo "--- output tree (maxdepth 4) ---"
              find "$OUT" -maxdepth 4 -type f 2>/dev/null | head -80 || true
              echo "--- cache/sources kernel dirs ---"
              find "${ARMBIAN_BUILD_DIR}/cache/sources" -maxdepth 2 -type d -name 'linux-*' 2>/dev/null | head -10 || true
              exit 1
          fi

          mkdir -p "${OUT}/images"
          if [[ "$IMG" != "${OUT}/images/Image" ]]; then
              cp "$IMG" "${OUT}/images/Image"
          fi
          IMG="${OUT}/images/Image"

          echo ""
          echo "=== Raw Image assertion ==="
          ls -l "$IMG"
          python3 - "$IMG" <<'PY'
          import os
          import struct
          import sys

          p = sys.argv[1]
          size = os.path.getsize(p)
          h = open(p, 'rb').read(64)
          w0, w1 = struct.unpack('<II', h[0:8])
          text_offset, image_size, flags, _r2, _r3, _r4 = struct.unpack('<QQQQQQ', h[8:56])
          magic = h[56:60]

          print("  file path     : %s" % p)
          print("  file size     : %d bytes" % size)
          print("  code0         : 0x%08x  (must be 0xd503201f NOP)" % w0)
          print("  code1         : 0x%08x  (branch to primary_entry)" % w1)
          print("  text_offset   : 0x%x" % text_offset)
          print("  image_size    : 0x%x (%d bytes)" % (image_size, image_size))
          print("  flags         : 0x%x" % flags)
          print("  magic[56:60]  : %r  (must be b'ARMd')" % magic)

          fail = []
          if h[:2] == b'MZ':
              fail.append("first 2 bytes are 'MZ' -> PE/EFI vmlinuz, NOT a raw Image")
          if w0 != 0xd503201f:
              fail.append("code0=0x%08x != 0xd503201f (NOP)" % w0)
          if magic != b'ARMd':
              fail.append("magic=%r != b'ARMd'" % magic)
          # 注意: arm64 Image 的 image_size 允许比文件本身大 (含 bss/对齐)
          # 实测 EFI stub 内核: file=54026752, image_size=54919168 (+892416).
          if image_size == 0:
              fail.append("image_size=0 invalid")
          elif image_size > size:
              print("  NOTE: image_size > file size (+%d bytes, bss/padding)" % (image_size - size))
              if image_size > size + 32 * 1024 * 1024:
                  fail.append("image_size=%d 超出文件大小 32MiB 以上, 可疑" % image_size)
          if flags != 0xa:
              print("  WARN: flags=0x%x (factory kernel uses 0xa)" % flags)

          for m in fail:
              print("FATAL: " + m)
          sys.exit(1 if fail else 0)
          PY
          echo "=== Raw Image assertion PASSED ==="

      # Round 5: ccache save 关闭 (理由同上方 Restore ccache)
      # - name: Save ccache
      #   if: always()
      #   uses: actions/cache/save@v4
      #   with:
      #     path: ${{ env.CCACHE_DIR }}
      #     key: ccache-${{ runner.os }}-${{ hashFiles('**/kernel/*.patch', 'config/sections/*.config') }}

      # ============================================================
      # Round 5: 编译后磁盘观测 (always) — 失败也执行
      # 输出写进 disk-report.txt, 下一次用 always() 上传, 保证失败也能拿到
      # ============================================================
      - name: Collect disk diagnostics after compile (always)
        if: always()
        run: |
          REPORT="${GITHUB_WORKSPACE}/disk-report.txt"
          {
            echo ""
            echo "=============================================="
            echo "=== AFTER compile  $(date -u +%FT%TZ) ==="
            echo "=============================================="
            df -h / || true
            df -h "${ARMBIAN_BUILD_DIR}" || true
            [ -d /mnt ] && df -h /mnt || true
            echo "--- du key dirs (after) ---"
            du -sh "${ARMBIAN_BUILD_DIR}/cache/sources" 2>/dev/null || true
            du -sh "${ARMBIAN_BUILD_DIR}/cache" 2>/dev/null || true
            du -sh "${ARMBIAN_BUILD_DIR}/output" 2>/dev/null || true
            du -sh "${ARMBIAN_BUILD_DIR}/userpatches" 2>/dev/null || true
            du -sh /var/lib/docker 2>/dev/null || true
            echo "--- output/images ---"
            ls -la "${ARMBIAN_BUILD_DIR}/output/images" 2>/dev/null || true
          } | tee -a "$REPORT" || true

          echo ""
          echo "--- full disk-report.txt ---"
          cat "$REPORT" 2>/dev/null || true

      - name: Upload disk diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disk-report-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/disk-report.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armbian-build-output-${{ github.run_number }}
          path: |
            ${{ env.ARMBIAN_BUILD_DIR }}/output/images
            ${{ env.ARMBIAN_BUILD_DIR }}/compile.log
          retention-days: 14
          if-no-files-found: ignore

# ============================================================
# Job 3: assemble — boot.img + rootfs fstab patch + verify + upload
# (和 Round 2 一样, 不动)
# ============================================================
  assemble:
    name: "assemble: boot.img + verify + upload"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [build-armbian]
    if: needs.build-armbian.outputs.exit_code == '0' && github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install assemble deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
              device-tree-compiler kpartx gdisk fdisk e2fsprogs \
              dosfstools mtools python3-pyelftools

      - name: Download Armbian output
        uses: actions/download-artifact@v4
        with:
          name: armbian-build-output-${{ github.run_number }}
          path: armbian-output

      - name: Find and decompress rootfs img
        id: decompress
        run: |
          echo "=== Downloaded ==="
          find armbian-output -type f

          XZ_OR_IMG=$(find armbian-output -type f \( -name "*.img.xz" -o -name "*.img" \) | head -1)
          if [[ -z "$XZ_OR_IMG" ]]; then
              echo "NO ROOTFS IMG FOUND"
              echo "Assemble job aborted (build-armbian may have failed)."
              exit 1
          fi

          if [[ "$XZ_OR_IMG" == *.xz ]]; then
              echo "Decompressing .img.xz ..."
              xz -k -d "$XZ_OR_IMG"
              ROOTFS="${XZ_OR_IMG%.xz}"
          else
              ROOTFS="$XZ_OR_IMG"
          fi

          echo "ROOTFS=${ROOTFS}" >> "$GITHUB_OUTPUT"
          echo "Rootfs img: $(stat -c%s "$ROOTFS") bytes"

      # ============================================================
      # Round 9 (A): AOSP boot image v0
      #   kernel 段 = gzip -9 Image + dtb 拼在 gzip 流之后
      #   (aboot: is_gzip_package() → decompress() 返回 dtb_offset,
      #    之后 dev_tree_appended() 在压缩流末尾找 dtb)
      #   header: page 2048 / kernel 0x80080000 / ramdisk 0x82000000 /
      #           tags 0x81E00000 / header_version 0
      #   ^ Round 10: 三个地址改回原厂 2.1 值, 与 aboot 的固定布局完全对齐;
      #     Image 必须 <= 28 MiB, 保证 0x80080000+28MiB = 0x81C00000 < tags 0x81E00000.
      # 内核只从构建产物取, 绝不再从 rootfs /boot/Image 取 (那是 PE 文件).
      # ============================================================
      - name: Build boot.img — AOSP v0 (gzip Image + appended dtb + initrd)
        run: |
          set -euo pipefail
          ROOTFS="${{ steps.decompress.outputs.ROOTFS }}"

          # ---- 1. 内核: 只从构建产物取 ----
          KERNEL_IMG=$(find armbian-output -type f -name Image | head -1)
          if [[ -z "$KERNEL_IMG" || ! -f "$KERNEL_IMG" ]]; then
              echo "FATAL: no Image in build artifact"
              find armbian-output -type f | head -50
              exit 1
          fi
          echo "kernel source: $KERNEL_IMG ($(stat -c%s "$KERNEL_IMG") bytes)"

          # 硬断言 (assemble 阶段再验一次, 防止 artifact 传错)
          if [[ "$(head -c2 "$KERNEL_IMG")" == "MZ" ]]; then
              echo "FATAL: Image starts with 'MZ' (PE/EFI) — refusing to pack"; exit 1
          fi
          W0=$(od -An -tx4 -N4 "$KERNEL_IMG" | tr -d ' \n')
          if [[ "$W0" != "d503201f" ]]; then
              echo "FATAL: Image code0=$W0 != d503201f — not a raw arm64 Image"; exit 1
          fi
          echo "  code0=0x$W0 OK"

          # ---- 2. 挂 rootfs 取 initrd + dtb ----
          ROOTFS_LOOP=$(sudo losetup -fP --show "$ROOTFS")
          ROOT_M=/mnt/ufi003-rootfs
          sudo mkdir -p "$ROOT_M"
          sudo mount "${ROOTFS_LOOP}p1" "$ROOT_M" 2>/dev/null || sudo mount "$ROOTFS_LOOP" "$ROOT_M"

          INITRD=$(find -L "$ROOT_M/boot" -maxdepth 1 -type f -name "initrd*" 2>/dev/null | head -1 || true)
          if [[ -z "$INITRD" ]]; then
              echo "FATAL: no initrd found in rootfs /boot"; exit 1
          fi
          echo "initrd source: $INITRD ($(stat -c%s "$INITRD") bytes)"

          # dtb — 必须是 UFI003 自己的 dtb (收紧匹配, 不要任意 msm8916 dtb)
          DTB=""
          for cand in \
              msm8916-handsome-openstick-ufi003.dtb \
              msm8916-handsome-openstick-ufi003-armbian.dtb; do
              DTB=$(find -L "$ROOT_M" -name "$cand" 2>/dev/null | head -1 || true)
              [[ -n "$DTB" ]] && break
          done
          if [[ -z "$DTB" ]]; then
              DTB=$(find -L "$ROOT_M" -name "*openstick*ufi003*.dtb" 2>/dev/null | head -1 || true)
          fi
          if [[ -n "$DTB" ]]; then
              echo "dtb source: $DTB ($(stat -c%s "$DTB") bytes)"
          else
              echo "WARN: no ufi003 dtb in rootfs, compiling from repo dts"
              DTB=/tmp/ufi003-repo.dtb
              dtc -I dts -O dtb -o "$DTB" msm8916-handsome-openstick-ufi003-armbian.dts
          fi

          python3 - "$DTB" <<'PY'
          import struct, sys
          d = open(sys.argv[1], 'rb').read()
          # FDT 头是大端 (magic 0xd00dfeed 在文件里是 d0 0d fe ed)
          magic, totalsize = struct.unpack('>II', d[:8])
          print("  dtb magic=0x%08x totalsize=%d file=%d" % (magic, totalsize, len(d)))
          if magic != 0xd00dfeed:
              print("FATAL: dtb magic != 0xd00dfeed"); sys.exit(1)
          if totalsize != len(d):
              print("  WARN: dtb totalsize != file size (trailing padding)")
          PY

          echo "=== dtb model (人工核对) ==="
          strings "$DTB" 2>/dev/null | grep -m3 -iE 'Handsome OpenStick|UFI003' || echo "  (model string not found — WARN only)"

          # ---- 3. kernel 段 = gzip -9 Image || dtb ----
          # -n 去掉 FNAME/mtime, 保证 gzip 头是 1f 8b 08 00 (aboot 只认 FLG=0x00)
          gzip -9 -n -c "$KERNEL_IMG" > /tmp/Image.gz
          if [[ "$(head -c4 /tmp/Image.gz | od -An -tx1 | tr -d ' \n')" != "1f8b0800" ]]; then
              echo "FATAL: gzip header is not 1f 8b 08 00"; exit 1
          fi
          cat /tmp/Image.gz "$DTB" > /tmp/kernel-dtb.bin
          KSIZE=$(stat -c%s /tmp/kernel-dtb.bin)
          RSIZE=$(stat -c%s "$INITRD")
          echo "  Image.gz            : $(stat -c%s /tmp/Image.gz) bytes"
          echo "  dtb                 : $(stat -c%s "$DTB") bytes"
          echo "  kernel_size(gz+dtb) : $KSIZE bytes"
          echo "  ramdisk_size        : $RSIZE bytes"

          # ---- 4. 尺寸 / 地址硬约束 (Round 10: 原厂布局) ----
          # kernel 0x80080000 / ramdisk 0x82000000 / tags 0x81E00000, page 2048.
          # Image 解压后落在 0x80080000, 必须 <= 28 MiB 才能落在 tags 之下.
          python3 - "$KERNEL_IMG" "$KSIZE" "$RSIZE" <<'PY'
          import os, struct, sys

          p, ksize, rsize = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          h = open(p, 'rb').read(64)
          image_size = struct.unpack('<Q', h[16:24])[0]
          kernel_addr, ramdisk_addr, tags_addr = 0x80080000, 0x82000000, 0x81E00000
          page = 2048
          r4 = lambda n: ((n + page - 1) // page) * page
          img_end = kernel_addr + image_size
          total = page + r4(ksize) + r4(rsize)

          print("  image_size=%d (%.2f MiB), decompressed end=0x%x" %
                (image_size, image_size / 1048576.0, img_end))
          print("  ramdisk_end=0x%x, boot.img total=%d bytes (%.2f MiB)" %
                (ramdisk_addr + r4(rsize), total, total / 1048576.0))
          fail = []
          if image_size > 28 * 1024 * 1024:
              fail.append("Image %d > 28 MiB (会压到 tags 0x81E00000)" % image_size)
          if ksize + rsize > 63 * 1024 * 1024:
              fail.append("payload %d > 63 MiB" % (ksize + rsize))
          if total > 32 * 1024 * 1024:
              fail.append("boot.img %d > 32 MiB" % total)
          elif total > 30 * 1024 * 1024:
              print("  WARN: boot.img %.2f MiB > 30 MiB 目标" % (total / 1048576.0))
          if img_end >= tags_addr:
              fail.append("kernel end 0x%x >= tags_addr 0x%x" % (img_end, tags_addr))
          if img_end >= ramdisk_addr:
              fail.append("kernel end 0x%x >= ramdisk_addr 0x%x" % (img_end, ramdisk_addr))
          for m in fail:
              print("FATAL: " + m)
          sys.exit(1 if fail else 0)
          PY

          # ---- 5. AOSP boot v0 头 + 打包 ----
          # kernel 段按 page 对齐, ramdisk 从 page+ROUND(kernel_size) 开始 (aboot 的读法)
          mkdir -p output/fastboot
          python3 - /tmp/kernel-dtb.bin "$INITRD" output/fastboot/boot.img "$KERNEL_IMG" <<'PY'
          import struct, sys

          kpath, rpath, out, imgpath = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          PAGE = 2048
          KERNEL_ADDR, RAMDISK_ADDR, TAGS_ADDR = 0x80080000, 0x82000000, 0x81E00000
          CMDLINE = (b"earlycon root=PARTUUID=a7ab80e8-e9d1-e8cd-f157-93f69b1d141e "
                     b"console=ttyMSM0,115200 rootwait no_framebuffer=true rw")

          k = open(kpath, 'rb').read()
          r = open(rpath, 'rb').read()
          image_size = struct.unpack('<Q', open(imgpath, 'rb').read(24)[16:24])[0]
          r4 = lambda n: ((n + PAGE - 1) // PAGE) * PAGE

          hdr = struct.pack('<8s10I16s512s32s1024s',
                            b'ANDROID!',
                            len(k), KERNEL_ADDR,      # kernel_size, kernel_addr
                            len(r), RAMDISK_ADDR,     # ramdisk_size, ramdisk_addr
                            0, 0,                     # second_size, second_addr
                            TAGS_ADDR, PAGE,
                            0, 0,                     # header_version, dt_size
                            b'UFI003', CMDLINE, b'\0' * 32, b'\0' * 1024)
          assert len(hdr) == 1632, len(hdr)

          body = hdr + b'\0' * (PAGE - len(hdr))
          body += k + b'\0' * (r4(len(k)) - len(k))
          body += r + b'\0' * (r4(len(r)) - len(r))
          open(out, 'wb').write(body)

          print("  --- SIZE REPORT ---")
          print("  Image (decompressed) : %d bytes (%.2f MiB)" % (image_size, image_size / 1048576.0))
          print("  kernel_size (gz+dtb) : %d bytes" % len(k))
          print("  ramdisk_size         : %d bytes" % len(r))
          print("  ramdisk_off          : %d (0x%x, 2048 对齐)" % (PAGE + r4(len(k)), PAGE + r4(len(k))))
          print("  boot.img total       : %d bytes (%.2f MiB)" % (len(body), len(body) / 1048576.0))
          print("  kernel_addr          : 0x%08x" % KERNEL_ADDR)
          print("  ramdisk_addr         : 0x%08x" % RAMDISK_ADDR)
          print("  tags_addr            : 0x%08x" % TAGS_ADDR)
          print("  page=%d  header_version=0  dt_size=0" % PAGE)
          print("  cmdline        : %s" % CMDLINE.decode())
          PY

          ls -l output/fastboot/boot.img

          sudo sync
          sudo umount "${ROOTFS_LOOP}p1" 2>/dev/null || sudo umount "$ROOT_M"
          sudo losetup -d "$ROOTFS_LOOP"

      - name: Patch rootfs /etc/fstab (PARTLABEL=rootfs)
        run: |
          ROOTFS="${{ steps.decompress.outputs.ROOTFS }}"
          ROOTFS_LOOP=$(sudo losetup -fP --show "$ROOTFS")
          ROOT_M=/mnt/ufi003-rootfs-edit
          sudo mkdir -p "$ROOT_M"
          sudo mount "${ROOTFS_LOOP}p1" "$ROOT_M" 2>/dev/null || sudo mount "$ROOTFS_LOOP" "$ROOT_M"

          printf '%s\n' \
              '# UFI003 Armbian /etc/fstab' \
              'PARTLABEL=rootfs / ext4 defaults,noatime,errors=remount-ro 0 1' \
              'proc /proc proc defaults 0 0' \
              'tmpfs /tmp tmpfs defaults,nosuid,nodev,size=512m 0 0' \
              'devtmpfs /dev devtmpfs defaults,mode=0755,nosuid 0 0' \
              | sudo tee "$ROOT_M/etc/fstab" >/dev/null

          echo "=== Patched fstab ==="
          cat "$ROOT_M/etc/fstab"

          sudo sync
          # 先落盘再 dd: 这样导出的 rootfs.img 才包含刚写入的 fstab
          P1_BYTES=$(sudo blockdev --getsize64 "${ROOTFS_LOOP}p1")
          echo "rootfs partition: ${P1_BYTES} bytes"
          mkdir -p output/fastboot
          # rootfs.img 必须是"裸 ext4 分区镜像", 不能是带 GPT 分区表的整盘 .img:
          #   flash-fastboot.sh 用 `fastboot flash rootfs rootfs.img` 直接写进 lk2nd 的
          #   rootfs 分区; 整盘镜像灌进去会让文件系统整体偏移 (GPT 数据区从 1MiB 起),
          #   内核按 PARTLABEL=rootfs 挂载时找不到 ext4 超级块.
          #   verify-image.sh L114 也是按 `file rootfs.img | grep ext4` 断言的.
          sudo dd if="${ROOTFS_LOOP}p1" of=output/fastboot/rootfs.img bs=1M status=none
          sudo chown "$(id -u):$(id -g)" output/fastboot/rootfs.img
          sudo umount "${ROOTFS_LOOP}p1" 2>/dev/null || sudo umount "$ROOT_M"
          sudo losetup -d "$ROOTFS_LOOP"

      - name: Verify artifacts
        run: |
          set -uo pipefail
          BOOT_IMG="output/fastboot/boot.img"
          ROOTFS_IMG="output/fastboot/rootfs.img"
          PASS=0; FAIL=0

          boop() { if eval "$1" 2>/dev/null; then echo "  OK: $2"; PASS=$((PASS+1)); else echo "  FAIL: $2"; FAIL=$((FAIL+1)); fi; }

          boop "[ -f '$BOOT_IMG' ] && [ \$(stat -c%s '$BOOT_IMG') -le 67108864 ]" "boot.img <= 64MB"
          boop "[ -f '$ROOTFS_IMG' ]" "rootfs.img exists"

          # ---- AOSP boot v0 头 + kernel 段内容校验 ----
          python3 - "$BOOT_IMG" <<'PY'
          import struct, sys, zlib

          p = sys.argv[1]
          d = open(p, 'rb').read()
          h = d[:1632]
          magic = h[:8]
          ks, ka, rs, ra, ss, sa, ta, pg, hv, osv = struct.unpack('<10I', h[8:48])
          cmd = h[64:576].split(b'\0')[0].decode('ascii', 'replace')

          print("  boot.img size : %d bytes" % len(d))
          print("  magic         : %r" % magic)
          print("  kernel_size   : %d @ 0x%x" % (ks, ka))
          print("  ramdisk_size  : %d @ 0x%x" % (rs, ra))
          print("  tags_addr     : 0x%x  page=%d  header_version=%d" % (ta, pg, hv))
          print("  cmdline       : %s" % cmd)

          ok = True
          def chk(name, cond):
              global ok
              print(("  OK:   " if cond else "  FAIL: ") + name)
              if not cond:
                  ok = False

          chk("magic == ANDROID!", magic == b'ANDROID!')
          chk("page_size == 2048", pg == 2048)
          chk("kernel_addr == 0x80080000", ka == 0x80080000)
          chk("ramdisk_addr == 0x82000000 (原厂)", ra == 0x82000000)
          chk("tags_addr == 0x81E00000 (原厂)", ta == 0x81E00000)
          chk("header_version == 0", hv == 0)
          chk("second_size == 0", ss == 0)
          chk("cmdline root=PARTUUID a7ab80e8-...", "root=PARTUUID=a7ab80e8-e9d1-e8cd-f157-93f69b1d141e" in cmd)
          chk("cmdline 不再依赖 by-partlabel/udev", "by-partlabel" not in cmd)
          chk("payload <= 63 MiB", ks + rs <= 63 * 1024 * 1024)
          chk("boot.img <= 30 MiB (目标)", len(d) <= 30 * 1024 * 1024)
          chk("boot.img <= 32 MiB (硬上限)", len(d) <= 32 * 1024 * 1024)

          r4 = lambda n: ((n + pg - 1) // pg) * pg
          kseg = d[pg:pg + ks]
          rseg = d[pg + r4(ks):pg + r4(ks) + rs]
          chk("gzip 头 == 1f 8b 08 00 (无 FNAME)", kseg[:4] == b'\x1f\x8b\x08\x00')
          chk("initrd 段长度正确且非空", len(rseg) == rs and rs > 0)
          chk("ramdisk 偏移页对齐", (pg + r4(ks)) % pg == 0)
          chk("kernel 段含 dtb magic", b'\xd0\x0d\xfe\xed' in kseg)

          try:
              obj = zlib.decompressobj(31)
              dec = obj.decompress(kseg) + obj.flush()
          except Exception as e:
              dec = b''
              print("  gzip error: %s" % e)

          w0 = struct.unpack('<I', dec[:4])[0] if len(dec) >= 4 else 0
          dsize = struct.unpack('<Q', dec[16:24])[0] if len(dec) >= 24 else 0
          print("  gzip payload decompressed: %d bytes, code0=0x%08x, image_size=0x%x" % (len(dec), w0, dsize))
          print("  --- SIZE REPORT (boot.img) ---")
          print("  Image (decompressed) : %d bytes (%.2f MiB)" % (len(dec), len(dec) / 1048576.0))
          print("  kernel_size (gz+dtb) : %d bytes" % ks)
          print("  boot.img total       : %d bytes (%.2f MiB)" % (len(d), len(d) / 1048576.0))
          print("  addrs: kernel=0x%08x ramdisk=0x%08x tags=0x%08x page=%d" % (ka, ra, ta, pg))
          chk("gzip kernel 可解压", len(dec) > 0)
          chk("解压后 code0 == d503201f", w0 == 0xd503201f)
          chk("解压后 image_size > 0", dsize > 0)
          chk("Image <= 28 MiB (地址约束)", len(dec) <= 28 * 1024 * 1024)
          chk("kernel 末端 0x%x < tags 0x81E00000" % (ka + len(dec)), ka + len(dec) < 0x81E00000)
          # image_size 可大于实际解压长度 (含 bss), 允许 32MiB 内差异
          chk("image_size 与实际解压长度相差 <= 32MiB", abs(dsize - len(dec)) <= 32 * 1024 * 1024)

          sys.exit(0 if ok else 1)
          PY
          if [[ $? -eq 0 ]]; then PASS=$((PASS+1)); else FAIL=$((FAIL+1)); fi

          ROOTFS_LOOP=$(sudo losetup -fP --show "$ROOTFS_IMG")
          ROOT_M=/mnt/vr
          sudo mkdir -p "$ROOT_M"
          sudo mount "${ROOTFS_LOOP}p1" "$ROOT_M" 2>/dev/null || sudo mount "$ROOTFS_LOOP" "$ROOT_M"

          boop "file '$ROOTFS_IMG' | grep -qi 'ext4'" "rootfs.img is ext4"
          boop "grep -qiE 'PARTLABEL=rootfs|by-partlabel/rootfs' '$ROOT_M/etc/fstab'" "rootfs fstab correct"
          boop "[ -f '$ROOT_M/sbin/init' ]" "rootfs has systemd"

          sudo umount "${ROOTFS_LOOP}p1" 2>/dev/null || sudo umount "$ROOT_M"
          sudo losetup -d "$ROOTFS_LOOP"

          echo ""
          echo "PASS=$PASS FAIL=$FAIL"
          [[ $FAIL -eq 0 ]] || exit 1

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "ufi003-armebian-${{ github.run_number }}"
          path: |
            output/fastboot/boot.img
            output/fastboot/rootfs.img
          retention-days: 30
          if-no-files-found: error

      - name: Upload tools + source (reference)
        uses: actions/upload-artifact@v4
        with:
          name: "ufi003-tools-${{ github.run_number }}"
          path: |
            config/
            userpatches/
            scripts/
            msm8916-handsome-openstick-ufi003-armbian.dts
            flash-fastboot.sh
            flash-edl.sh
            verify-image.sh
            FINAL_ANSWERS.md
            ufi003-armbian-build-guide.md
          retention-days: 30
          if-no-files-found: warn
